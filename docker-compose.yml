# ComfyUI via the published GHCR image.
#
#   docker compose up -d
#
# Builds from source only if you first run `docker compose build`.
services:
  comfyui:
    image: ghcr.io/hexrebuilt/comfyui-docker:latest
    # Comment out to build locally from the Dockerfile instead of pulling.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: comfyui
    restart: unless-stopped

    ports:
      - "8188:8188"

    # Optional: the service degrades gracefully without a .env file, so a
    # fresh clone does not need one. Copy .env.example to .env to set keys.
    env_file:
      - path: .env
        required: false

    environment:
      AUTO_UPDATE: "${AUTO_UPDATE:-true}"
      UPDATE_SCHEDULE: "${UPDATE_SCHEDULE:-0 4 * * *}"
      # Set ENABLE_CRON=false to disable the in-container scheduler entirely.
      UPDATE_INTERVAL: "${UPDATE_INTERVAL:-24h}"
      ENABLE_CRON: "${ENABLE_CRON:-true}"
      HF_TOKEN: "${HF_TOKEN:-}"
      CIVITAI_API_KEY: "${CIVITAI_API_KEY:-}"

    volumes:
      - ./models:/opt/ComfyUI/models
      - ./input:/opt/ComfyUI/input
      - ./output:/opt/ComfyUI/output
      - ./custom_nodes:/opt/ComfyUI/custom_nodes

    # ComfyUI needs no Linux capabilities. Dropping all of them is safe and
    # meaningfully reduces the blast radius of a compromised custom node.
    cap_drop:
      - ALL

    # Blocks setuid escalation inside the container.
    security_opt:
      - no-new-privileges:true

    # ComfyUI writes to the bind-mounted model and output dirs.
    user: "${PUID:-1000}:${PGID:-1000}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Matches the image's HEALTHCHECK; disable so `depends_on: healthy` works.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8188/system_stats"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  # MCP server so an AI client can drive the ComfyUI service above.
  #
  # Under the `mcp` profile, so it never starts with a plain `docker compose up`.
  # This server is stdio: your AI client spawns it per session and speaks MCP
  # over stdin/stdout, so there is nothing to "keep running". See docs/MCP.md
  # for the client snippets.
  #
  # Pull and keep current with:
  #   docker compose --profile mcp pull comfy-mcp
  # The image also self-updates at startup, so a run is current either way.
  comfy-mcp:
    image: ghcr.io/hexrebuilt/comfyui-docker-mcp:latest
    profiles: ["mcp"]
    # Keeps stdin open for the client's MCP stream.
    stdin_open: true
    depends_on:
      comfyui:
        condition: service_healthy
    # Deliberately NO `ports:` here. This service speaks MCP over stdin/stdout
    # and opens no listening socket at all, so publishing a port does nothing --
    # and publishing 8188 collides with the comfyui service above, which fails
    # the whole stack with "Bind for 0.0.0.0:8188 failed: port is already
    # allocated".
    #
    # Use it as:  docker compose --profile mcp run --rm comfy-mcp
    # which attaches stdin, which is how an MCP client talks to it.
    # For network access use the comfy-mcp-http service further below.
    # Host networking so ComfyUI is reachable at a LOOPBACK address.
    #
    # comfy-cli refuses to fetch /object_info from a non-loopback host in local
    # mode ("Refusing to fetch object_info from non-loopback host ... potential
    # SSRF"), and is_loopback_host() only accepts the literal `localhost` or a
    # 127.x address -- it does not resolve names. A compose service name and the
    # container's IP are therefore both refused, which broke `nodes` outright.
    # Sharing the host network namespace puts ComfyUI's published port on
    # 127.0.0.1, which satisfies the guard with no upstream change.
    #
    # Cost: this now depends on the host-published 8188 rather than talking over
    # the compose network. If you change the comfyui port mapping, change
    # COMFYUI_URL below to match.
    network_mode: host
    environment:
      COMFYUI_URL: http://127.0.0.1:8188
      COMFY_LOCAL_URL: http://127.0.0.1:8188
      # Upgrade comfy-mcp / comfy-cli to the latest PyPI release at startup.
      # On by default. Set false in .env to pin to whatever the image ships.
      AUTO_UPDATE: "${AUTO_UPDATE:-true}"
      # Uncomment to spend credits on hosted partner models. Off by default.
      # COMFY_API_KEY: "${COMFY_API_KEY:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Deliberately NO `user:` override here, unlike the comfyui service.
    # This service mounts nothing, so there is no host-uid ownership problem to
    # solve -- and overriding it would be actively harmful: PUID is meant to be
    # set to your host uid for the bind mounts, and reusing it here would run
    # this container as a uid that does not own its own site-packages, so the
    # startup auto-update would fail on permissions. The image's USER 1000:1000
    # already matches PUID's default.

  # Optional: the same MCP server published over HTTP, so a client on another
  # machine can reach it instead of spawning it over stdio.
  #
  # Behind the `mcp-http` profile and NOT published to the host by default --
  # only `MCP_BIND_ADDR=127.0.0.1` below, so it is reachable from the host only
  # until you deliberately change it.
  #
  # comfy-mcp itself has no authentication, so the bridge requires
  # MCP_AUTH_TOKEN and refuses to start on a non-loopback bind without one.
  # Generate one with: openssl rand -hex 24
  comfy-mcp-http:
    image: ghcr.io/hexrebuilt/comfyui-docker-mcp:latest
    profiles: ["mcp-http"]
    entrypoint: ["/usr/local/bin/mcp-http-bridge.py"]
    depends_on:
      comfyui:
        condition: service_healthy
    # Host networking, same reason as the stdio service above: comfy-cli needs
    # ComfyUI on a loopback address or it refuses to fetch object_info.
    #
    # It also means NO `ports:` mapping -- the bridge binds the host's interfaces
    # directly, so MCP_BIND_ADDR now names the address it binds rather than a
    # host-side publish address. Loopback-only by default, as before.
    network_mode: host
    environment:
      COMFYUI_URL: http://127.0.0.1:8188
      COMFY_LOCAL_URL: http://127.0.0.1:8188
      # With host networking the bridge binds the host directly, so the bind
      # address IS the exposure. MCP_PUBLIC_BIND is kept as the explicit input
      # to the token policy: non-loopback there means the bridge refuses to
      # start without MCP_AUTH_TOKEN.
      MCP_HTTP_HOST: "${MCP_BIND_ADDR:-127.0.0.1}"
      MCP_PUBLIC_BIND: "${MCP_BIND_ADDR:-127.0.0.1}"
      MCP_HTTP_PORT: "${MCP_HTTP_PORT:-8081}"
      # Not enforced with ${VAR:?...} on purpose: compose interpolates every
      # service regardless of profile, so requiring it here would break a plain
      # `docker compose up` for anyone who never wants the HTTP bridge. The
      # bridge refuses to start without it, which fails at the point of use.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
      AUTO_UPDATE: "${AUTO_UPDATE:-true}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No `user:` override: this container owns its own site-packages so the
    # startup auto-update can write. See the note on the comfy-mcp service.
    restart: unless-stopped
