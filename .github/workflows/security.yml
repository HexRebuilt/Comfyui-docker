name: Security

# Lint and vulnerability checks. Runs on every push and PR; the heavy
# container scan only runs on pushes so PRs stay fast.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
# Runner label is pinned, not `ubuntu-latest`.
# GitHub migrates `ubuntu-latest` to Ubuntu 26.04 between 2026-10-19 and
# 2026-11-19 (actions/runner-images#14748); their documented mitigation is to
# name `ubuntu-24.04`. Only the lint job installs a runner package
# (shellcheck), and the published image is unaffected either way because the
# Dockerfile pins its own userland via FROM nvidia/cuda:...-ubuntu24.04.

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis of the two files we author: Dockerfile and entrypoint.
  lint:
    name: Lint (hadolint + shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          # DL3008: apt versions in Ubuntu-based images are not usefully
          #   pinnable; they are tied to the base image's apt snapshot.
          # DL3013: the build pins torch/torchvision/torchaudio explicitly;
          #   `wheel` is removed after use.
          # DL3025: the HEALTHCHECK must use shell form because the probe
          #   needs `|| exit 1`. JSON/exec form cannot express that.
          ignore: DL3008,DL3013,DL3025
          dockerfile: Dockerfile

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: shellcheck entrypoint
        run: shellcheck --severity=style docker-entrypoint.sh

      - name: Validate compose file
        run: docker compose config --quiet

  # Secret scanning. This is the control that should have caught a leaked
  # .env or token before it reached the registry.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history, so a secret committed and later deleted is still found.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # Do not let a fork PR publish findings to a public repo.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Vulnerability scan of the filesystem: OS packages and Python deps.
  # Needs `write` only to upload the SARIF report to code scanning.
  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          # Infrastructure-as-code only. Dependency CVEs are covered by the
          # image scan in build-and-push.yml; scanning them here as well would
          # duplicate the report without adding signal.
          scanners: misconfig,secret

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # Supply-chain posture of the repo and workflows.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard