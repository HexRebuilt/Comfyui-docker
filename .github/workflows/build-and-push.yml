name: Build and Push

# Builds the container and publishes it to GHCR (ghcr.io), then scans the
# published image and emits an SBOM + provenance attestation.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Weekly, so the MCP image tracks comfy-mcp/comfy-cli upstream releases
  # without anyone having to push a commit. The MCP image deliberately does not
  # self-update at runtime (see Dockerfile.mcp): an image that changes under a
  # live MCP session is exactly the failure mode the scheduled rebuild avoids.
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC, deliberately off the :00 stampede

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

# Runner label is pinned, not `ubuntu-latest`.
# GitHub migrates `ubuntu-latest` to Ubuntu 26.04 between 2026-10-19 and
# 2026-11-19 (actions/runner-images#14748); their documented mitigation is to
# name `ubuntu-24.04`. Only the lint job installs a runner package
# (shellcheck), and the published image is unaffected either way because the
# Dockerfile pins its own userland via FROM nvidia/cuda:...-ubuntu24.04.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compute the lowercased image name once and share it with both jobs, so the
  # push and the scan cannot drift apart on repository-name casing.
  image-name:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.lower.outputs.name }}
    steps:
      - id: lower
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # Build, and publish only from master or a tag. A PR build proves the image
  # still builds without granting it a registry path.
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    needs: image-name
    # The weekly schedule exists to refresh the MCP image, which is the only
    # thing that tracks a floating upstream dependency. Rebuilding the 11 GB
    # ComfyUI image weekly would burn runner minutes to produce identical layers.
    if: github.event_name != 'schedule'
    env:
      # Lowercased: this repository is named "Comfyui-docker" and
      # github.repository preserves the capital C, but OCI image references must
      # be lowercase. buildx silently lowercases when pushing while trivy
      # parses the ref strictly, so both must be built from the same name.
      IMAGE_NAME: ${{ needs.image-name.outputs.name }}
    outputs:
      # Digest of the pushed manifest list, so the scan below is pinned even
      # if `latest` moves between the build and the scan.
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      # No QEMU setup: the build is amd64-only (see the platforms note below),
      # so no emulation is required.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Only push on non-PR events, and only from the default branch or a tag,
      # so a fork or a side branch cannot publish to the registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` tracks the default branch, matching the MCP image below.
          #
          # It used to mean "newest release": latest=auto's default, where a
          # semver tag sets it but a branch push does not. That was wrong here.
          # This deployment pins `latest` in docker-compose.yml and watches that
          # same tag with watchtower, so the tag that must always move is
          # `latest`. Gating it on a release left the stack on a stale image in
          # between: v1.0.1 still carried comfy-kitchen 0.2.36 while upstream
          # wanted 0.2.37, and ComfyUI logged "lower than the recommended
          # version" on every boot with no way to get the fix without cutting a
          # release.
          #
          # A branch push to the default branch therefore also sets `latest`, and
          # a semver tag still moves it alongside its own pinned tag. Prereleases
          # (v1.1.0-rc1) stay off `latest` -- latest=auto keeps that. Use the
          # sha- and semver-pinned tags when you need a reproducible image.
          # No branch-named tag (no `master`): a branch tag is a second moving
          # tag for the same commit, and two moving tags is exactly how a
          # deployment ends up pinned to one of them by accident. `latest` is
          # the only floating tag; the rest are immutable pins.
          tags: |
            type=ref,event=pr
            # The leading v is part of the output so pushing git tag v1.0.0
            # publishes image tag v1.0.0. Plain {{version}} strips it and would
            # publish 1.0.0, which nobody types.
            type=semver,pattern=v{{version}}
            # Minor-tracking float: v1.0.1 also moves 1.0.
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # What actually moves `latest` on every default-branch push.
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64 only, deliberately.
      #
      # This image exists to run CUDA on an NVIDIA GPU, and there is no useful
      # arm64 target for that: aarch64 Jetson uses a different base image
      # (nvcr.io/nvidia/l4t), and Apple Silicon cannot run CUDA at all.
      #
      # An arm64 build was also failing outright. torch's
      # nvidia-cusparselt-cu13 dependency ships only a legacy-tagged
      # manylinux2014_aarch64 wheel, which pip will not select under QEMU
      # emulation ("not supported on this platform"), so `pip check` failed and
      # took the build down. Emulating a CUDA stack for a platform that cannot
      # use it is wasted runner time as well.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # `latest` is the mutable tag most people pull, so only move it when
          # the build from the default branch actually succeeded.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Produce an SBOM and a build provenance attestation for the image.
          sbom: true
          provenance: mode=max

  # Scan what was actually published, not a locally rebuilt approximation.
  scan:
    name: Trivy (published image)
    runs-on: ubuntu-24.04
    needs: [image-name, build]
    # Nothing to scan on a PR (nothing was pushed), nor on the weekly schedule
    # (the ComfyUI image is not rebuilt then).
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    env:
      IMAGE_NAME: ${{ needs.image-name.outputs.name }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # Required for .trivyignore, which the scan step references by path.
      - uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          # Digest ref: immune to `latest` moving while the scan runs.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          # These four are copies vendored inside pip and setuptools. Each
          # entry is justified in .trivyignore.
          trivyignores: .trivyignore

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # The MCP server image. Small and GPU-free, so it builds in seconds and gets
  # its own scan. Published to a separate repository name so it can be pulled
  # and versioned independently of the ComfyUI image.
  build-mcp:
    name: Build and push (MCP)
    runs-on: ubuntu-24.04
    needs: image-name
    env:
      IMAGE_NAME: ${{ needs.image-name.outputs.name }}-mcp
    # Push on master, tags, and the weekly schedule. Never on a PR.
    if: github.event_name != 'pull_request'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` tracks the default branch, deliberately.
          #
          # It used to mean "newest release" instead, which turned out to be the
          # wrong default for this deployment:
          #
          #   - `latest` is what docker-compose.yml pins and what watchtower
          #     watches, so it has to be the tag that always moves. Gating it on a
          #     release left the stack pinned to a stale image between releases --
          #     the v1.0.1 image still carried comfy-kitchen 0.2.36 while upstream
          #     required 0.2.37, and ComfyUI logged a version warning on every
          #     boot with no way to pick up the fix without a release.
          #   - mixed tagging was confusing: the ComfyUI image moved `latest` only
          #     on tags while the MCP image moved it on every default-branch push,
          #     so the two services in one stack could sit on different policies.
          #
          # So both images now behave identically: `latest` = newest default
          # branch, and semver tags additionally publish their own pinned tags.
          # Reproducible builds are served by the sha- and semver-pinned tags.
          flavor: |
            latest=false
          # No branch-named tag (no `master`), for the same reason as the
          # ComfyUI image job above.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # Covers the weekly schedule too: a schedule run's ref is the
            # default branch, so is_default_branch is true there.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.mcp
          # The MCP client runs this, and it runs on a host with a GPU; there is
          # no useful arm64 target here either.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
          sbom: true
          provenance: mode=max

  # Scan the published MCP image too. It has a different dependency set, so the
  # ComfyUI image's scan says nothing about it.
  scan-mcp:
    name: Trivy (MCP image)
    runs-on: ubuntu-24.04
    needs: [image-name, build-mcp]
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      IMAGE_NAME: ${{ needs.image-name.outputs.name }}-mcp
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-mcp.outputs.image-digest }}
          format: sarif
          output: trivy-mcp.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-mcp.sarif
          category: trivy-mcp
