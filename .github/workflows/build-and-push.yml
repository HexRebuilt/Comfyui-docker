name: Build and Push

# Builds the container and publishes it to GHCR (ghcr.io), then scans the
# published image and emits an SBOM + provenance attestation.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compute the lowercased image name once and share it with both jobs, so the
  # push and the scan cannot drift apart on repository-name casing.
  image-name:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.lower.outputs.name }}
    steps:
      - id: lower
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # Build, and publish only from master or a tag. A PR build proves the image
  # still builds without granting it a registry path.
  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: image-name
    env:
      # Lowercased: this repository is named "Comfyui-docker" and
      # github.repository preserves the capital C, but OCI image references must
      # be lowercase. buildx silently lowercases when pushing while trivy
      # parses the ref strictly, so both must be built from the same name.
      IMAGE_NAME: ${{ needs.image-name.outputs.name }}
    outputs:
      # Digest of the pushed manifest list, so the scan below is pinned even
      # if `latest` moves between the build and the scan.
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      # No QEMU setup: the build is amd64-only (see the platforms note below),
      # so no emulation is required.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Only push on non-PR events, and only from the default branch or a tag,
      # so a fork or a side branch cannot publish to the registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64 only, deliberately.
      #
      # This image exists to run CUDA on an NVIDIA GPU, and there is no useful
      # arm64 target for that: aarch64 Jetson uses a different base image
      # (nvcr.io/nvidia/l4t), and Apple Silicon cannot run CUDA at all.
      #
      # An arm64 build was also failing outright. torch's
      # nvidia-cusparselt-cu13 dependency ships only a legacy-tagged
      # manylinux2014_aarch64 wheel, which pip will not select under QEMU
      # emulation ("not supported on this platform"), so `pip check` failed and
      # took the build down. Emulating a CUDA stack for a platform that cannot
      # use it is wasted runner time as well.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # `latest` is the mutable tag most people pull, so only move it when
          # the build from the default branch actually succeeded.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Produce an SBOM and a build provenance attestation for the image.
          sbom: true
          provenance: mode=max

  # Scan what was actually published, not a locally rebuilt approximation.
  scan:
    name: Trivy (published image)
    needs: [image-name, build]
    env:
      IMAGE_NAME: ${{ needs.image-name.outputs.name }}
    # Nothing to scan on a PR: nothing was pushed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # Required for .trivyignore, which the scan step references by path.
      - uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          # Digest ref: immune to `latest` moving while the scan runs.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          # These four are copies vendored inside pip and setuptools. Each
          # entry is justified in .trivyignore.
          trivyignores: .trivyignore

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image