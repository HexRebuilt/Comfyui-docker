name: Dependency Watch

# Monthly alignment with upstream. Read-only with respect to the default branch:
# it computes what is behind, reports it, and opens a PR for the bump. It never
# pushes to master directly.
#
# What already updates itself, and needs nothing here:
#
#   ComfyUI          -> AUTO_UPDATE=true inside the container tracks master
#   comfy-mcp / cli  -> the MCP container upgrades at startup, plus a weekly
#                       rebuild of its image
#
# What does not update itself is everything the Dockerfile pins: the CUDA base
# image tag and the torch/torchvision/torchaudio triple. That is what this
# aligns, monthly, via a PR that auto-merges once CI is green.
#
# The logic lives in scripts/ so it can be run and tested locally:
#
#   ./scripts/dependency-check.sh    # report only
#   ./scripts/dependency-targets.sh  # what a safe bump would be
#   ./scripts/align-upstream.sh      # dry run
on:
  schedule:
    # 06:23 on the 1st of each month, UTC. Deliberately an odd minute: everyone
    # who picks cron for a monthly job picks :00, where GitHub's scheduled runs
    # queue.
    - cron: '23 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  # Used to file/update the tracking issue and to push the bump branch + PR.
  issues: write
  pull-requests: write

concurrency:
  group: dependency-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Report upstream drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Compare pinned versions against upstream
        id: check
        run: |
          set -uo pipefail
          # Writes its table to stdout and its prose to $GITHUB_STEP_SUMMARY,
          # then prints a trailing drift=0|1 line.
          ./scripts/dependency-check.sh | tee /tmp/check.out
          drift="$(grep -oE '^drift=[01]$' /tmp/check.out | tail -1 | cut -d= -f2)"
          echo "drift=${drift:-0}" >> "$GITHUB_OUTPUT"

      - name: File or update the tracking issue
        if: steps.check.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Upstream updates available
        run: |
          set -uo pipefail
          grep -vE '^drift=[01]$' /tmp/check.out > /tmp/table.md
          {
            cat /tmp/table.md
            echo ""
            echo "An automated PR is opened for these in the next step; this issue"
            echo "tracks the same drift for anyone who wants to look."
            echo ""
            echo "_Automated monthly check. Close once the pins are updated._"
          } > /tmp/issue.md

          # Update the existing issue rather than opening a new one every month.
          number=""
          while IFS=$'\t' read -r num t; do
            if [ "$t" = "$ISSUE_TITLE" ]; then number="$num"; break; fi
          done < <(gh issue list --state open --limit 100 --json number,title \
                   --jq '.[] | "\(.number)\t\(.title)"')

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/issue.md >/dev/null
            echo "Updated issue #${number}"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file /tmp/issue.md >/dev/null
            echo "Opened a new tracking issue"
          fi

  align:
    name: Align pinned versions with upstream
    runs-on: ubuntu-24.04
    needs: watch
    # Schedule only. workflow_dispatch is for inspection: opening and
    # auto-merging a PR should be a deliberate act, not a side effect of
    # pressing the button to look at the report.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7.0.1

      # The resolver asks pip which torchvision pairs with a given torch, using
      # the published MCP image so no extra tooling is needed on the runner.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump, open a PR, and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: ./scripts/align-upstream.sh --apply